<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Shield Live Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0c; color: #e4e4e7; padding: 15px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 26px; color: #00ffcc; font-weight: 800; letter-spacing: -0.5px; }
        .header p { font-size: 13px; color: #a1a1aa; margin-top: 4px; }
        
        .display-card { background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 20px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .input-section { margin-bottom: 20px; }
        .metric-label { font-size: 11px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; font-weight: 600; }
        
        /* High-visibility input styles optimized for mobile keyboards */
        .main-input { width: 100%; background: #0a0a0c; border: 1px solid #3f3f46; border-radius: 10px; color: #fff; padding: 12px; font-size: 18px; text-align: center; outline: none; margin-bottom: 12px; transition: border-color 0.2s; }
        .main-input:focus { border-color: #00ffcc; }
        
        .scan-btn { width: 100%; background: #00ffcc; color: #0a0a0c; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .scan-btn:active { background: #00cca3; }

        .product-output-box { background: #27272a; border-radius: 10px; padding: 14px; margin-bottom: 15px; display: none; border: 1px solid #3f3f46; }
        .product-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .product-meta { font-size: 13px; color: #a1a1aa; margin-bottom: 10px; }
        
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .metric-box { background: #18181b; padding: 8px; border-radius: 6px; text-align: center; border: 1px solid #3f3f46; }
        .metric-box-value { font-size: 15px; font-weight: bold; color: #fff; margin-top: 2px; }

        .location-section { background: #27272a; border-radius: 10px; padding: 14px; margin-bottom: 15px; }
        .location-row { display: flex; gap: 8px; }
        .store-dropdown { flex: 1; background: #0a0a0c; border: 1px solid #3f3f46; color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
        .geo-btn { background: #3f3f46; color: #fff; border: none; border-radius: 6px; padding: 0 12px; font-size: 14px; cursor: pointer; }

        .alert-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 10px; padding: 12px; color: #f87171; font-size: 13px; font-weight: 500; display: none; text-align: center; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Price Shield Engine</h1>
        <p>Type barcode number to expose shrinkflation in real time</p>
    </div>
    
    <div class="display-card">
        <!-- Input Layer -->
        <div class="input-section">
            <label class="metric-label">Enter Barcode Number (From Package)</label>
            <!-- inputmode="numeric" automatically forces the iPhone to show the number pad keyboard -->
            <input type="text" pattern="[0-9]*" inputmode="numeric" maxlength="13" class="main-input" id="barcode-field" placeholder="000000000000">
            <button class="scan-btn" onclick="fetchRegistryData()">🔍 Query Registry</button>
        </div>

        <!-- Dynamic Product Registry Output Block -->
        <div class="product-output-box" id="output-block">
            <div class="product-title" id="p-name">Querying...</div>
            <div class="product-meta" id="p-brand">Brand</div>
            <div class="metric-grid">
                <div class="metric-box">
                    <div class="metric-label" style="font-size: 9px;">True Weight</div>
                    <div class="metric-box-value" id="p-weight">-- oz</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label" style="font-size: 9px;">Calculated Value</div>
                    <div class="metric-box-value" id="p-ratio">--/oz</div>
                </div>
            </div>
        </div>

        <!-- Location Context Section -->
        <div class="location-section">
            <label class="metric-label">📍 Where is this price found?</label>
            <div class="location-row">
                <select class="store-dropdown" id="store-select">
                    <option value="Store">Select Store (Anonymous)</option>
                    <option value="Walmart">Walmart</option>
                    <option value="Kroger">Kroger</option>
                    <option value="Target">Target</option>
                    <option value="Aldi">Aldi</option>
                    <option value="Dollar General">Dollar General</option>
                    <option value="Costco">Costco</option>
                </select>
                <button class="geo-btn" onclick="getGPSLocation()" id="geo-button-text">📍 GPS</button>
            </div>
        </div>

        <!-- Price Entry Layer -->
        <div class="input-section" style="margin-bottom: 0;">
            <label class="metric-label">Enter Shelf Sticker Price ($)</label>
            <input type="number" step="0.01" class="main-input" id="shelf-price-field" placeholder="0.00" inputmode="decimal">
            <button class="scan-btn" style="background: #fff; color: #0a0a0c;" onclick="calculateMetrics()">⚡ Run Price Analysis</button>
        </div>
        
        <div class="alert-box" id="shrinkflation-alert"></div>
    </div>

    <script>
        let currentProductOunces = 16.0;

        function fetchRegistryData() {
            let upc = document.getElementById('barcode-field').value.trim();
            if (!upc) return;

            document.getElementById('output-block').style.display = 'block';
            document.getElementById('p-name').innerText = "Querying Registry...";
            document.getElementById('p-brand').innerText = "";
            document.getElementById('p-weight').innerText = "--";

            // Directly queries Open Food Facts using the direct-barcode endpoint to bypass CORS network blocks
            let apiUrl = `https://openfoodfacts.org{upc}.json?fields=product_name,brands,quantity,product_quantity`;
            
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 1 && data.product) {
                        let prod = data.product;
                        document.getElementById('p-name').innerText = prod.product_name || "Registered Item";
                        document.getElementById('p-brand').innerText = prod.brands || "Generic Brand";
                        
                        let rawQuantity = prod.quantity || "Size Unlisted";
                        document.getElementById('p-weight').innerText = rawQuantity;
                        
                        currentProductOunces = parseFloat(prod.product_quantity) ? (parseFloat(prod.product_quantity) * 0.035274).toFixed(1) : 16.0;
                        if(rawQuantity.toLowerCase().includes('oz')) {
                            currentProductOunces = parseFloat(rawQuantity);
                        }
                    } else {
                        // Safe fallback handling if barcode is brand-new to the database registers
                        document.getElementById('p-name').innerText = "Not Found in Registry";
                        document.getElementById('p-brand').innerText = "Manual Override Engaged";
                        document.getElementById('p-weight').innerText = "16.0 oz (Standard Base)";
                        currentProductOunces = 16.0;
                    }
                })
                .catch(err => {
                    document.getElementById('p-name').innerText = "Database Request Timed Out";
                });
        }

        function getGPSLocation() {
            let btnText = document.getElementById('geo-button-text');
            if (!navigator.geolocation) { alert("GPS not supported."); return; }
            btnText.innerText = "...";
            navigator.geolocation.getCurrentPosition(function(position) {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                let mapUrl = `https://openstreetmap.org{lat}&lon=${lon}`;
                fetch(mapUrl)
                    .then(res => res.json())
                    .then(geoData => {
                        let storeName = geoData.address.shop || geoData.address.amenity || geoData.address.supermarket || "Current Store";
                        btnText.innerText = "✅";
                        let dropdown = document.getElementById('store-select');
                        let newOption = document.createElement("option");
                        newOption.text = storeName; newOption.value = storeName; newOption.selected = true;
                        dropdown.add(newOption);
                    })
                    .catch(() => { btnText.innerText = "❌"; });
            }, function() { btnText.innerText = "❌"; });
        }

        function calculateMetrics() {
            let price = parseFloat(document.getElementById('shelf-price-field').value);
            let selectedStore = document.getElementById('store-select').value;
            if (!price || price <= 0) return;
            
            let pricePerOunce = (price / currentProductOunces).toFixed(3);
