<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Shield Live Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0c; color: #e4e4e7; padding: 15px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 26px; color: #00ffcc; font-weight: 800; letter-spacing: -0.5px; }
        .header p { font-size: 13px; color: #a1a1aa; margin-top: 4px; }
        
        .display-card { background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 20px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .input-section { margin-bottom: 15px; }
        .metric-label { font-size: 11px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; font-weight: 600; }
        
        .main-input { width: 100%; background: #0a0a0c; border: 1px solid #3f3f46; border-radius: 10px; color: #fff; padding: 12px; font-size: 18px; text-align: center; outline: none; margin-bottom: 10px; transition: border-color 0.2s; }
        .main-input:focus { border-color: #00ffcc; }
        
        .scan-btn { width: 100%; background: #00ffcc; color: #0a0a0c; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .scan-btn:active { background: #00cca3; }

        .product-output-box { background: #27272a; border-radius: 10px; padding: 14px; margin-bottom: 15px; display: block; border: 1px solid #3f3f46; }
        .product-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .product-meta { font-size: 13px; color: #a1a1aa; margin-bottom: 10px; }
        
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .metric-box { background: #18181b; padding: 8px; border-radius: 6px; text-align: center; border: 1px solid #3f3f46; }
        .metric-box-value { font-size: 15px; font-weight: bold; color: #fff; margin-top: 2px; }

        .location-section { background: #27272a; border-radius: 10px; padding: 14px; margin-bottom: 15px; }
        .location-row { display: flex; gap: 8px; }
        .store-dropdown { flex: 1; background: #0a0a0c; border: 1px solid #3f3f46; color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
        .geo-btn { background: #3f3f46; color: #fff; border: none; border-radius: 6px; padding: 0 12px; font-size: 14px; cursor: pointer; }

        .alert-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 10px; padding: 12px; color: #f87171; font-size: 13px; font-weight: 500; display: none; text-align: center; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Price Shield Engine</h1>
        <p>Expose shrinkflation and surveillance pricing in real time</p>
    </div>
    
    <div class="display-card">
        
        <!-- Target Weight Setting Layer -->
        <div class="input-section">
            <label class="metric-label">1. Product Package Size (Ounces)</label>
            <input type="number" step="0.1" class="main-input" id="weight-field" placeholder="Enter Oz (e.g. 16.0)" value="16.0" inputmode="decimal">
        </div>

        <!-- Location Context Section -->
        <div class="location-section">
            <label class="metric-label">📍 2. Where is this price found?</label>
            <div class="location-row">
                <select class="store-dropdown" id="store-select">
                    <option value="Store">Select Store (Anonymous)</option>
                    <option value="Walmart">Walmart</option>
                    <option value="Kroger">Kroger</option>
                    <option value="Target">Target</option>
                    <option value="Aldi">Aldi</option>
                    <option value="Dollar General">Dollar General</option>
                    <option value="Costco">Costco</option>
                </select>
                <button class="geo-btn" onclick="getGPSLocation()" id="geo-button-text">📍 GPS</button>
            </div>
        </div>

        <!-- Price Entry Layer -->
        <div class="input-section">
            <label class="metric-label">3. Enter Shelf Sticker Price ($)</label>
            <input type="number" step="0.01" class="main-input" id="shelf-price-field" placeholder="0.00" inputmode="decimal">
            <button class="scan-btn" onclick="calculateMetrics()">⚡ Run Price Analysis</button>
        </div>

        <!-- Dynamic Registry Output Block -->
        <div class="product-output-box" id="output-block">
            <div class="product-title">Value Metrics Dashboard</div>
            <div class="product-meta">Real-time valuation analytics</div>
            <div class="metric-grid">
                <div class="metric-box">
                    <div class="metric-label" style="font-size: 9px;">Target Weight</div>
                    <div class="metric-box-value" id="p-weight">16.0 oz</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label" style="font-size: 9px;">Calculated Value</div>
                    <div class="metric-box-value" id="p-ratio">$0.000/oz</div>
                </div>
            </div>
        </div>
        
        <div class="alert-box" id="shrinkflation-alert"></div>
    </div>

    <script>
        function getGPSLocation() {
            let btnText = document.getElementById('geo-button-text');
            if (!navigator.geolocation) { alert("GPS not supported."); return; }
            btnText.innerText = "...";
            navigator.geolocation.getCurrentPosition(function(position) {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                let mapUrl = `https://openstreetmap.org{lat}&lat=${lat}&lon=${lon}`;
                fetch(mapUrl)
                    .then(res => res.json())
                    .then(geoData => {
                        let storeName = geoData.address.shop || geoData.address.amenity || geoData.address.supermarket || "Current Store";
                        btnText.innerText = "✅";
                        let dropdown = document.getElementById('store-select');
                        let newOption = document.createElement("option");
                        newOption.text = storeName; newOption.value = storeName; newOption.selected = true;
                        dropdown.add(newOption);
                    })
                    .catch(() => { btnText.innerText = "❌"; });
            }, function() { btnText.innerText = "❌"; });
        }

        function calculateMetrics() {
            let price = parseFloat(document.getElementById('shelf-price-field').value);
            let ounces = parseFloat(document.getElementById('weight-field').value);
            let selectedStore = document.getElementById('store-select').value;
            
            if (!price || price <= 0 || !ounces || ounces <= 0) {
                alert("Please enter a valid price and package size ounces.");
                return;
            }
            
            let pricePerOunce = (price / ounces).toFixed(3);
            
            // Update Dashboard UI Elements instantly
            document.getElementById('p-weight').innerText = ounces.toFixed(1) + " oz";
            document.getElementById('p-ratio').innerText = `$${pricePerOunce}/oz`;
            
            let alertBox = document.getElementById('shrinkflation-alert');
            alertBox.style.display = 'block';
            
            // Algorithmic evaluation baseline parameter logic
            if (pricePerOunce > 0.35) { 
                alertBox.style.color = '#f87171'; alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.1)'; alertBox.style.borderColor = 'rgba(239, 68, 68, 0.2)';
                alertBox.innerHTML = `<strong>🚨 SQUEEZE DETECTED AT ${selectedStore.toUpperCase()}:</strong> This item is tracking at <strong>$${pricePerOunce}/oz</strong>. Corporate margin expansion detected. Check alternative sizes or nearby brands.`;
            } else {
                alertBox.style.color = '#34d399'; alertBox.style.backgroundColor = 'rgba(52, 211, 153, 0.1)'; alertBox.style.borderColor = 'rgba(52, 211, 153, 0.2)';
                alertBox.innerHTML = `<strong>✅ FAIR VALUE COMPLIANT:</strong> Cost is <strong>$${pricePerOunce}/oz</strong> at ${selectedStore}. Price matches baseline weight-to-currency ratios.`;
            }
        }
    </script>
</body>
</html>
