<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Shield Live Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0c; color: #e4e4e7; padding: 15px; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { font-size: 24px; color: #00ffcc; font-weight: 800; letter-spacing: -0.5px; }
        .header p { font-size: 13px; color: #a1a1aa; margin-top: 4px; }
        #scanner-viewport { position: relative; width: 100%; max-width: 450px; height: 220px; margin: 0 auto; border: 2px solid #27272a; border-radius: 16px; overflow: hidden; background: #18181b; }
        #scanner-viewport video { width: 100%; height: 100%; object-fit: cover; }
        .scan-target { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75%; height: 80px; border: 2px dashed #00ffcc; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none; }
        .display-card { background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 16px; max-width: 450px; margin: 15px auto 0; }
        .product-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .product-meta { font-size: 14px; color: #a1a1aa; margin-bottom: 12px; }
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .metric-box { background: #27272a; padding: 10px; border-radius: 8px; text-align: center; }
        .metric-label { font-size: 11px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
        .metric-value { font-size: 16px; font-weight: bold; color: #fff; margin-top: 2px; }
        
        .location-section { background: #27272a; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .location-row { display: flex; gap: 8px; margin-top: 6px; }
        .store-dropdown { flex: 1; background: #0a0a0c; border: 1px solid #3f3f46; color: #fff; padding: 8px; border-radius: 6px; font-size: 14px; outline: none; }
        .geo-btn { background: #3f3f46; color: #fff; border: none; border-radius: 6px; padding: 0 12px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .geo-btn:active { background: #52525b; }

        .price-input-row { display: flex; gap: 8px; margin-top: 6px; }
        .price-input { flex: 1; background: #0a0a0c; border: 1px solid #3f3f46; border-radius: 8px; color: #fff; padding: 10px; font-size: 16px; text-align: center; outline: none; }
        .price-input:focus { border-color: #00ffcc; }
        .submit-btn { background: #00ffcc; color: #0a0a0c; border: none; border-radius: 8px; padding: 0 20px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .submit-btn:active { background: #00cca3; }
        .alert-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; padding: 10px; color: #f87171; font-size: 13px; font-weight: 500; display: none; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Price Shield Engine</h1>
        <p>Align grocery barcode inside the grid lines to scan</p>
    </div>
    
    <div id="scanner-viewport">
        <video id="native-video-feed" autoplay playsinline muted></video>
        <div class="scan-target"></div>
    </div>

    <div class="display-card">
        <div id="product-display">
            <div class="product-title" id="p-name">Scan Target Active</div>
            <div class="product-meta" id="p-upc">Position barcode in viewfinder</div>
            
            <div class="metric-grid">
                <div class="metric-box"><div class="metric-label">Registry Weight</div><div class="metric-value" id="p-weight">16.0 oz</div></div>
                <div class="metric-box"><div class="metric-label">Brand Owner</div><div class="metric-value" id="p-brand">Awaiting Scan...</div></div>
            </div>

            <div class="location-section">
                <label class="metric-label">📍 Where is this price found?</label>
                <div class="location-row">
                    <select class="store-dropdown" id="store-select">
                        <option value="Unknown">Select Store (Anonymous)</option>
                        <option value="Walmart">Walmart</option>
                        <option value="Kroger">Kroger</option>
                        <option value="Target">Target</option>
                        <option value="Aldi">Aldi</option>
                        <option value="Dollar General">Dollar General</option>
                        <option value="Costco">Costco</option>
                        <option value="Whole Foods">Whole Foods</option>
                    </select>
                    <button class="geo-btn" onclick="getGPSLocation()" id="geo-button-text">📍 Use GPS</button>
                </div>
            </div>

            <div class="metric-label">Enter Current Shelf Price ($)</div>
            <div class="price-input-row">
                <input type="number" step="0.01" class="price-input" id="shelf-price-field" placeholder="0.00" inputmode="decimal">
                <button class="submit-btn" onclick="calculateLiveMetrics()">Analyze</button>
            </div>
            
            <div class="alert-box" id="shrinkflation-alert"></div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('native-video-feed');
        let currentProductOunces = 16.0;
        let lastScannedBarcode = "";
        let barcodeDetector;

        // Verify device supports native browser barcode scanning APIs
        if ('BarcodeDetector' in window) {
            barcodeDetector = new BarcodeDetector({ formats: ['upc_a', 'upc_e', 'ean_13', 'code_128'] });
        } else {
            document.getElementById('p-name').innerText = "System Constraint Alert";
            document.getElementById('p-upc').innerText = "Native Barcode Engine Missing. Use Safari.";
        }
        
        const constraints = {
            audio: false,
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        };

        navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
                videoElement.srcObject = stream;
                // Once camera frame stream maps cleanly, launch the analysis loop interval
                videoElement.addEventListener('play', () => {
                    setInterval(analyzeVideoFrame, 3000); // Scans the video track feed every 300 milliseconds
                });
            })
            .catch((err) => { console.error("Hardware exception:", err); });

        // High speed background processing thread scanning active canvas pixels
        async function analyzeVideoFrame() {
            if (!barcodeDetector || videoElement.paused || videoElement.ended) return;
            
            try {
                const barcodes = await barcodeDetector.detect(videoElement);
                if (barcodes.length > 0) {
                    let detectedCode = barcodes[0].rawValue;
                    
                    // Stop repeating server fetches if looking at the same item
                    if (detectedCode === lastScannedBarcode) return;
                    lastScannedBarcode = detectedCode;
                    
                    document.getElementById('p-name').innerText = "Querying registries...";
                    document.getElementById('p-upc').innerText = "UPC: " + detectedCode;
                    
                    fetchProductFromRegistry(detectedCode);
                }
            } catch (error) {
                console.error("Frame scanning failure:", error);
            }
        }

        function fetchProductFromRegistry(upc) {
            let apiUrl = `https://openfoodfacts.org{upc}.json?fields=product_name,brands,quantity,product_quantity`;
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 1 && data.product) {
                        let prod = data.product;
                        document.getElementById('p-name').innerText = prod.product_name || "Unknown Product";
                        document.getElementById('p-brand').innerText = prod.brands || "Generic Brand";
                        let rawQuantity = prod.quantity || "Size Unavailable";
                        document.getElementById('p-weight').innerText = rawQuantity;
                        
                        currentProductOunces = parseFloat(prod.product_quantity) ? (parseFloat(prod.product_quantity) * 0.035274).toFixed(1) : 16.0;
                        if(rawQuantity.toLowerCase().includes('oz')) { currentProductOunces = parseFloat(rawQuantity); }
                    } else {
                        document.getElementById('p-name').innerText = "Unregistered Item Base Line";
                        document.getElementById('p-brand').innerText = "Manual Review Required";
                        document.getElementById('p-weight').innerText = "16.0 oz (Estimated)";
                        currentProductOunces = 16.0;
                    }
                })
                .catch(err => { console.error("Network fault:", err); });
        }

        function getGPSLocation() {
            let btnText = document.getElementById('geo-button-text');
            if (!navigator.geolocation) { alert("GPS not supported."); return; }
            btnText.innerText = "Searching...";
            navigator.geolocation.getCurrentPosition(function(position) {
                let lat = position.coords.latitude;
